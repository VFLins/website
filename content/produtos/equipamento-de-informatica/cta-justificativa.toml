[description]
css_class = "p mw6"
text = """
  O investimento em um computador pode nos deixar com medo, seja de gastar demais
  comprando um aparelho superdimensionado, ou de se frustrar com a compra de um aparelho
  defasado.
  <br /><br />
  Uma consultoria especializada será capaz de encontrar o equilíbrio ideal, garantindo
  um nível de desempenho compatível com as suas necessidades.
"""

