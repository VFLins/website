content = "On the other hand, we denounce with righteous indignation and dislike men who are so beguiled and demoralized by the charms of pleasure of the moment, so blinded by desire, that they cannot foresee the pain and trouble that are bound to ensue; and equal blame belongs to those who fail in their duty through weakness of will, which is the same as saying tthrough shrinking from toil and pain. These cases are perfectly simple and easy to distinguish. The wise man through shrinking from toil and pain. These cases are perfectly simple and easy to distinguish. The wise man hrough shrinking from toil and pain. These cases are perfectly simple and easy to distinguish. The wise man therefore always holds in these matters to this principle of selection: he rejects pleasures to secure other greater pleasures, or else he endures pains to avoid worse pains."
