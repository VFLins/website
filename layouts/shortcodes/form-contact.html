{{ $.Scratch.Add "labelClasses" "b db mb1 mt3" }}
{{ $.Scratch.Add "inputClasses" "w-100 pv3 ph3 bg-slategray-alt bn br2" }}

<style>
  input:focus, textarea:focus { outline: 2px solid var(--brand-color) }
  input[type="submit"] {
    border: none;
    background-color: var(--brand-color);
    color: var(--bg-color);
  }
  input[type="submit"]:hover {
    border: none;
    background-color: var(--brand-color-alt);
    color: var(--fg-color);
  }
  ::placeholder {
    font-family: 'Space Mono', 'Courier New', Courier, mono;
    color: var(--fg-color);
  }
</style>

<form class="p" accept-charset="UTF-8" action="{{ .Get "action" }}" method="POST" role="form">

    <label class="{{ $.Scratch.Get "labelClasses" }}"  for="name">{{ lang.Translate "yourName" }}</label>
    <input type="text" id="name" name="name" class="{{ $.Scratch.Get "inputClasses" }}"  required placeholder="nome"  aria-labelledby="name"/>

    <label class="{{ $.Scratch.Get "labelClasses" }}" for="email">{{ lang.Translate "emailAddress" }}</label>
    <input type="email" id="email" name="email" class="{{ $.Scratch.Get "inputClasses" }}"  required placeholder="e-mail"  aria-labelledby="email"/>
    <div class="requirements f6 gray glow i ph3 overflow-hidden">
      {{ lang.Translate "emailRequiredNote" }}
    </div>

    <label class="{{ $.Scratch.Get "labelClasses" }}" for="message">{{ lang.Translate "message" }}</label>
    <textarea id="message" name="message" required placeholder="mensagem" class="{{ $.Scratch.Get "inputClasses" }} h4" aria-labelledby="message"></textarea>

    <input class="p-mono br2 w-100 mv2 pa3 pointer" type="submit" value="Enviar" />

</form>
