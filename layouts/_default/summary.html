<div class="mb4 nested-copy-line-height relative">
  <div class="mb3 pa3 overflow-hidden h-100 flex flex-column justify-between">

    <div>
      {{ if .Params.featured_image }}

        {{ with .Params.featured_image }}
        <div class="w-100">
          <a href="{{ $.RelPermalink }}" class="db">
            <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="db mb3 br2 aspect-16-9">
          </a>
        </div>
        {{ end }}

      {{ else }}

        {{ with .Params.featured_icon }}
        <div class="w-100">
          <a href="{{ $.RelPermalink }}" class="db">
            <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="db mb3 w2 object-cover">
          </a>
        </div>
        {{ end }}
  
      {{ end}}

      <h1 class="heading4 mt2 mb2">
        <a href="{{ .RelPermalink }}">
          {{ .Title }}
        </a>
      </h1>

      <div class="lh-copy nested-copy-line-height">
        <p>
        {{ if .Params.description}}
          {{ .Params.description }}
        {{ else }}
          {{ .Summary }}
        {{ end }}
        </p>
      </div>

    </div>
  </div>
</div>
