{{ if not .IsHome }}
  <div class="pt4 pb3 w-90 mw8 center">
    <h1 class="d1 mb0 fg-slategray word-wrap">
      {{ .Title | compare.Default .Site.Title }}<span class="teal blink">_</span>
    </h1>
    {{ with .Params.description }}
      <h2 class="subtitle fg-slategray center lh-copy mv5">
        {{ . }}
      </h2>
    {{ end }}
  </div>
{{ end }}
