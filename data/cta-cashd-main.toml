css_class = "bg-cashd white w-100 center"
id = "homepage-block-5"
page_height = true
text_width = 40
always_vertical = true

[image]
css_class = "w-100 w-50-ns"
path = "/images/gh_banner-cashd.png"

[title]
css_class = "heading2"
text = """
    Se você quer continuar registrando as compras no fiado, mas não quer mais usar
    a caderneta...
"""

[description]
css_class = "p"
text = "Traga seus registros para o <code>Cashd</code>, e facilite todo o processo."

[button]
type = "scroller" # 'scroller' or 'link'
css_class = "button-link-light"

[button.params]
text = "{ conheça }:"
scroll_to = "sobre"
# url = "/software/cashd"
